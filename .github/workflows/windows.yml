name: Build (Windows + Mac)

on:
  push:
    branches: [main]
    paths-ignore: ["brand/**", "shots/**", "docs/**"]   # artwork and screenshots don't need a new installer
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: write   # to publish the installer as a direct download

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE and Tracktion Engine
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 JUCE tracktion_engine
          git -C tracktion_engine submodule update --init --depth 1 modules/juce

      - uses: ilammy/msvc-dev-cmd@v1   # whichever Visual Studio the runner has, x64

      - uses: mozilla-actions/sccache-action@v0.0.9   # compile cache: later builds only redo what changed

      - name: Ninja
        shell: bash
        run: command -v ninja || choco install ninja -y

      - name: Build plugins (VST3)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          cmake --build build

      - name: Build MP3 encoder (LAME, LGPL)
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install mp3lame:x64-windows
          dll=$(ls "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/*mp3lame*.dll | head -1)
          cp "$dll" "$GITHUB_WORKSPACE/libmp3lame.dll"

      - name: Build SoundWave app
        run: |
          cmake -S app -B app/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DSW_LAME_LIB="$env:GITHUB_WORKSPACE/libmp3lame.dll"
          cmake --build app/build

      - name: Test on Windows (start the app, export WAV + MP3, open the window)
        shell: pwsh
        run: |
          $exe = "app/build/SoundWave_artefacts/Release/SoundWave.exe"
          $log = "$env:APPDATA\SoundWave\SoundWave.log"
          $p = Start-Process $exe -ArgumentList "--selftest `"$PWD\demo-samples`"" -PassThru
          $ok = $p.WaitForExit(180000)
          Get-Content $log -ErrorAction SilentlyContinue
          if (-not $ok) { $p.Kill(); throw "selftest hung" }
          if ($p.ExitCode -ne 0) { throw "selftest failed, exit code $($p.ExitCode)" }
          $p = Start-Process $exe -ArgumentList "--smoketest" -PassThru
          $ok = $p.WaitForExit(90000)
          Get-Content $log -ErrorAction SilentlyContinue
          if (-not $ok) { $p.Kill(); throw "app hung" }
          if ($p.ExitCode -ne 0) { throw "app crashed, exit code $($p.ExitCode)" }
          Remove-Item demo-samples\selftest* -ErrorAction SilentlyContinue

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/SoundWave dist/VST3
          cp app/build/SoundWave_artefacts/Release/SoundWave.exe dist/SoundWave/
          cp -r build/*_artefacts/Release/VST3/*.vst3 dist/VST3/
          cp LICENSE README.md dist/
          cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/share/mp3lame/copyright" dist/LAME-LICENSE.txt || true

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") { $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6" }
            else { choco install innosetup -y --no-progress; $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6" }
          }
          iscc installer\SoundWave.iss

      - uses: actions/upload-artifact@v4
        with: { name: windows, path: installer/Output/SoundWave-Setup.exe }

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  dmg: SoundWave-Mac-AppleSilicon.dmg }
          - { arch: x86_64, dmg: SoundWave-Mac-Intel.dmg }   # cross-built on the Apple Silicon runner
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE and Tracktion Engine
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 JUCE tracktion_engine
          git -C tracktion_engine submodule update --init --depth 1 modules/juce

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Tools
        run: brew install ninja lame coreutils || true

      - name: Build plugins (VST3 + AU, ${{ matrix.arch }})
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build

      - name: Build SoundWave app
        run: |
          cmake -S app -B app/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build app/build

      - name: Bundle MP3 encoder and sign (ad-hoc)
        run: |
          app=app/build/SoundWave_artefacts/Release/SoundWave.app
          [ "${{ matrix.arch }}" = arm64 ] && cp "$(brew --prefix lame)/lib/libmp3lame.dylib" "$app/Contents/MacOS/" || true   # ponytail: Homebrew LAME is arm64 only, so no MP3 export on Intel yet
          codesign --force --deep -s - "$app"
          for b in build/*_artefacts/Release/VST3/*.vst3 build/*_artefacts/Release/AU/*.component; do codesign --force --deep -s - "$b"; done

      - name: Test on macOS (start the app, export WAV + MP3, open the window)
        if: matrix.arch == 'arm64'   # the runner can't run Intel code
        run: |
          exe=app/build/SoundWave_artefacts/Release/SoundWave.app/Contents/MacOS/SoundWave
          gtimeout 180 "$exe" --selftest "$PWD/demo-samples"; r=$?
          cat ~/Library/Application\ Support/SoundWave/SoundWave.log 2>/dev/null | tail -40 || true
          [ $r -eq 0 ] || exit 1
          gtimeout 90 "$exe" --smoketest || exit 1
          rm -f demo-samples/selftest*

      - name: Disk image
        run: |
          mkdir -p dmg/Plugins/VST3 dmg/Plugins/AU
          cp -R app/build/SoundWave_artefacts/Release/SoundWave.app dmg/
          ln -s /Applications dmg/Applications
          cp -R build/*_artefacts/Release/VST3/*.vst3 dmg/Plugins/VST3/
          cp -R build/*_artefacts/Release/AU/*.component dmg/Plugins/AU/
          printf 'SoundWave para Mac\n\n1. Arrastra SoundWave a Aplicaciones.\n2. La primera vez: clic derecho en SoundWave > Abrir > Abrir (la app no esta firmada por Apple).\n3. Plugins para otros DAW: copia Plugins/VST3 a ~/Library/Audio/Plug-Ins/VST3 y Plugins/AU a ~/Library/Audio/Plug-Ins/Components.\n' > dmg/LEEME.txt
          cp LICENSE dmg/
          hdiutil create -volname SoundWave -srcfolder dmg -ov -format UDZO ${{ matrix.dmg }}

      - uses: actions/upload-artifact@v4
        with: { name: "mac-${{ matrix.arch }}", path: "${{ matrix.dmg }}" }

  publish:
    needs: [build, mac]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.mac.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish installers (direct downloads)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls windows/*.exe mac-*/*.dmg 2>/dev/null || true)
          gh release delete latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest $files --prerelease -R "$GITHUB_REPOSITORY" \
            --title "SoundWave (última versión)" \
            --notes "Windows: SoundWave-Setup.exe. Mac M1/M2/M3/M4: SoundWave-Mac-AppleSilicon.dmg. Mac Intel: SoundWave-Mac-Intel.dmg (abre, arrastra a Aplicaciones; la primera vez clic derecho > Abrir)."

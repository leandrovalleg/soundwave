<html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Space+Mono&display=swap"></head>
<body style="margin:0;background:#EFEFEF;font-family:'Space Mono',monospace;display:flex;gap:22px;padding:22px">
<script>
const R='#D71921', K='#111111', L='#E8B4B6';
// 7x7 glyphs; '1' = main dot, '2' = light dot (lighter red/grey)
const G={
 folderA:["11.....","1111111","1.....1","1.....1","1.....1","1.....1","1111111"],        // outline
 folderB:["11.....","1111111","1111111","1111111","1111111","1111111","1111111"],        // solid
 folderC:["11.....","1111111","1222221","1222221","1222221","1222221","1111111"],        // outline + light fill
 openA:  ["11.....","1111...","1......","1111111","1.....1",".1....1",".111111"],
 openB:  ["11.....","1111...","1......","1111111","1111111",".111111",".111111"],
 openC:  ["11.....","1111...","1......","1111111","1222221",".122221",".111111"],
 file:   [".......","...1...",".1.1.1.","11111111".slice(0,7),".1.1.1.","...1...","......."],
 arrowR: ["..1....","..11...","..111..","..1111.","..111..","..11...","..1...."],
 arrowD: [".......",".......","1111111",".11111.","..111..","...1...","......."],
};
function icon(name, col, light, size=18){
  const c=document.createElement('canvas'); const s=size/7; c.width=c.height=size*2; c.style.width=c.style.height=size+'px';
  const g=c.getContext('2d'); g.scale(2,2);
  G[name].forEach((row,j)=>[...row].forEach((ch,i)=>{ if(ch==='.')return; g.fillStyle= ch==='2'? light: col; g.beginPath(); g.arc(i*s+s/2,j*s+s/2,s*0.36,0,7); g.fill(); }));
  return c;
}
function panel(title, closed, open, folderCol, fileCol, arrowCol, light){
  const d=document.createElement('div');
  d.style.cssText='background:#fff;border:1px solid #DADADA;border-radius:18px;padding:16px 18px;width:270px';
  d.innerHTML='<div style="font-family:Doto;font-size:20px;margin-bottom:10px">'+title+'</div>';
  const rows=[[0,'open','@helpsisleet - Bounce'],[1,'closed','808'],[1,'closed','Clap & Snare'],[1,'closed','Hi-Hats'],[2,'file','Kick 01.wav'],[2,'file','Kick 02.wav'],[0,'closed','African Dreams'],[0,'closed','CYMATICS'],[0,'closed','samples']];
  for(const [ind,kind,txt] of rows){
    const r=document.createElement('div'); r.style.cssText='display:flex;align-items:center;gap:8px;height:24px;font-size:12px;padding-left:'+(ind*18)+'px';
    if(kind!=='file') r.appendChild(icon(kind==='open'?'arrowD':'arrowR',arrowCol,light,10)); else {const sp=document.createElement('span');sp.style.width='10px';r.appendChild(sp);}
    r.appendChild(kind==='file'? icon('file',fileCol,light,16) : icon(kind==='open'?open:closed, folderCol, light));
    const t=document.createElement('span'); t.textContent=txt; r.appendChild(t); d.appendChild(r);
  }
  document.body.appendChild(d);
}
panel('A  CONTORNO', 'folderA','openA', R, K, K, L);
panel('B  RELLENO',  'folderB','openB', R, R, R, L);
panel('C  MIXTO',    'folderC','openC', R, K, R, L);
</script></body></html>
